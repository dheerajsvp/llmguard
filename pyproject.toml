[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmguard"
version = "0.1.0"
description = "Guardrails and audit toolkit between an app and an LLM API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*", "alembic.*"]
ignore_missing_imports = true
