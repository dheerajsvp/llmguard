server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this origin, so the API needs no CORS. Only /api/ is
    # forwarded: /v1/chat is deliberately NOT reachable through the dashboard.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # style 'unsafe-inline' is needed because the chart library sets inline style attributes.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
